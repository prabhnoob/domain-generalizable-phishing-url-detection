[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-detection"
version = "0.1.0"
description = "Leakage-resistant evaluation for phishing URL detectors"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "tldextract>=5.1,<6",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
